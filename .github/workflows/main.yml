name: Oracle Linux Intel oneAPI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-and-parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build Oracle Linux with Intel compiler and oneMKL
        run: |
          mkdir -p ci-results
          docker build -f docker/oraclelinux97-r453/Dockerfile -t sbyadanear-oneapi . 2>&1 | tee ci-results/docker-build.log
      - name: Check documentation, package, science and threads
        run: |
          mkdir -p ci-results
          docker run --rm --cpus=2 \
            -e SBY_REQUIRE_INTEL=true -e MKL_VERBOSE=1 -e MKL_DYNAMIC=FALSE \
            -v "$PWD:/workspace/sbyadanear" sbyadanear-oneapi \
            bash tools/ci-check.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: oracle-linux-oneapi-evidence
          path: ci-results/
